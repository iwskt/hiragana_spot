<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d3a"><title>Hiragana spot the difference | J-SHARE</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183b37;background:#eef4f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,#f9e8c9 0,transparent 36%),#eef4f0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #c65c2a;outline-offset:3px}[hidden]{display:none!important}
.shell{max-width:760px;margin:auto;padding:20px 16px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 2px 20px}.brand{font-weight:900;letter-spacing:.1em;font-size:13px;color:#17665d}.panel{background:#fff;border:1px solid #dae5de;border-radius:26px;box-shadow:0 12px 42px rgba(20,58,48,.08);padding:clamp(22px,5vw,42px)}h1,h2,p{margin-top:0}h1{font-size:clamp(34px,7vw,57px);line-height:1.1;letter-spacing:-.045em;margin-bottom:18px}h2{font-size:clamp(25px,5vw,32px);line-height:1.25;letter-spacing:-.025em}.lead{font-size:17px;line-height:1.65;color:#46615a}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#af5d2c;font-size:12px;font-weight:850;margin-bottom:16px}.hero{font-size:80px;margin:12px 0 26px;line-height:1}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:26px 0 30px}.chip{background:#edf5f0;color:#285f55;font-weight:650;font-size:13px;padding:8px 12px;border-radius:40px}.primary{border:0;background:#17665d;color:#fff;border-radius:14px;font-weight:800;padding:16px 23px;min-height:54px}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:1px solid #bad3c9;background:white;color:#17665d;border-radius:12px;padding:10px 13px;font-weight:750}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#577067;font-size:13px;font-weight:750}.progress{height:8px;border-radius:12px;background:#e5eee9;margin:12px 0 29px;overflow:hidden}.progress span{display:block;height:100%;background:#e59b5a;border-radius:12px}.instruction{color:#637a72;font-size:14px;line-height:1.5}.actions{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:24px}.feedback{border-radius:16px;margin-top:19px;padding:19px;background:#f0f7ed;border-left:4px solid #4b9971}.feedback.reconsider{background:#fff5eb;border-color:#d98752}.feedback strong{font-size:18px}.feedback p{line-height:1.6;margin:10px 0 0}.note{font-size:14px;color:#526860}.meaning{color:#58776d;font-size:14px}.summaryGrid{display:grid;gap:10px;margin:22px 0}.review{border:1px solid #d8e5de;border-radius:14px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.review small{display:block;color:#60786e;margin-top:4px}.footer{font-size:12px;color:#697c73;line-height:1.55;margin:20px 4px}.linkBtn{border:0;background:none;text-decoration:underline;color:#17665d;font-weight:700;padding:8px 0}.setup{display:grid;gap:10px;margin:25px 0}.setup label{font-size:14px;font-weight:800;color:#315e54}.setup select{font-size:16px;border:1.5px solid #b9d1c5;border-radius:12px;background:#fff;padding:13px 12px;min-height:49px;width:100%;color:#173f38}.speak{border:1px solid #c9dcd3;background:#f4faf6;border-radius:11px;min-width:39px;height:39px;color:#17665d;font-size:18px}.speak:disabled{opacity:.45;cursor:not-allowed}.gridWrap{display:flex;justify-content:center}.kanaGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;width:min(100%,360px);margin:8px auto 0}.kanaCell{aspect-ratio:1/1;width:100%;min-width:0;min-height:43px;border:2px solid #d8e5de;border-radius:11px;background:#fff;color:#183b37;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:500;font-size:clamp(27px,8vw,40px);line-height:1;display:flex;align-items:center;justify-content:center;padding:0}.kanaCell:hover:not(:disabled){border-color:#4f9884;background:#f6fbf8}.kanaCell.wrong{border-color:#b86a4d;background:#fff3ed}.kanaCell.right{border-color:#23815d;background:#eef8f1}.kanaCell:disabled{cursor:default}.pairPreview{display:grid;gap:12px;margin:25px 0}.pairLine{display:flex;justify-content:center;align-items:center;gap:18px;background:#eaf4ef;border-radius:16px;padding:12px}.pairLetter{display:flex;align-items:center;flex-direction:column;gap:3px;min-width:92px}.pairLetter>span{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:48px;line-height:1.2}.pairLetter small{font-size:15px;color:#46615a}.vs{font-size:13px;color:#60786e}.feedback .speak{vertical-align:middle;margin-left:8px}@media(max-width:480px){.shell{padding:12px 12px 30px}.panel{border-radius:20px}.hero{font-size:65px}}@media(max-width:380px){.kanaGrid{gap:4px}.kanaCell{font-size:29px;border-radius:8px}.pairLetter{min-width:74px}}
</style></head>
<body><div class="shell"><header><div class="brand">J-SHARE <span aria-hidden="true">/</span> HIRAGANA SPOT</div></header><main id="app" class="panel"></main><p class="footer">Pre-arrival Japanese practice. No sign-in, account, analytics, or answer upload. Your answers stay in this tab. Audio uses your device's Japanese speech voice; pronunciation and availability vary by device.</p></div>
<script>
"use strict";
const groups={
  g1:{label:"あ・か・さ・た行",en:"Class block 1",pairs:[0,1]},
  g2:{label:"な・は・ま・や行",en:"Class block 2",pairs:[2,3]},
  g3:{label:"ら・わ行",en:"Class block 3",pairs:[4,5]},
  all:{label:"ひらがな全体",en:"All learned blocks",pairs:[0,1,2,3,4,5]}
};
const pairs=[
  {a:"あ",b:"お",ra:"a",rb:"o",tip:"Compare the small mark at the upper right and the curve at the bottom."},
  {a:"さ",b:"き",ra:"sa",rb:"ki",tip:"Look at the horizontal lines near the top: their number differs."},
  {a:"ぬ",b:"め",ra:"nu",rb:"me",tip:"ぬ has a small loop at the end. め does not."},
  {a:"は",b:"ほ",ra:"ha",rb:"ho",tip:"Compare the number of horizontal lines on the right side."},
  {a:"る",b:"ろ",ra:"ru",rb:"ro",tip:"る has a small loop at the bottom. ろ does not."},
  {a:"れ",b:"わ",ra:"re",rb:"wa",tip:"Focus on how the right side bends and finishes."}
];
const app=document.getElementById("app");
const state={scope:"g1",rounds:[],index:0,wrong:0,firstTry:0,done:false,wrongTiles:new Set(),previousPositions:[]};
const shuffle=values=>{let a=[...values];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function el(tag,cls,content){let e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function add(parent,...children){parent.append(...children);return parent}
const speechAvailable=()=>("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
function stopAudio(){if(speechAvailable())window.speechSynthesis.cancel()}
function audioButton(letter,reading){let b=el("button","speak","▶");b.type="button";b.disabled=!speechAvailable();b.setAttribute("aria-label","Play Japanese sound "+reading);b.dataset.speak=letter;return b}
function speak(letter){if(!speechAvailable())return;stopAudio();const utterance=new SpeechSynthesisUtterance(letter);utterance.lang="ja-JP";utterance.rate=.82;const voices=window.speechSynthesis.getVoices(),voice=voices.find(v=>v.lang.toLowerCase()==="ja-jp")||voices.find(v=>v.lang.toLowerCase().startsWith("ja"));if(voice)utterance.voice=voice;window.speechSynthesis.speak(utterance)}
function header(eyebrow,title,lead){add(app,el("div","eyebrow",eyebrow),el("h1","",title),el("p","lead",lead))}
function buttons(backLabel,backFn,forwardLabel,forwardFn,disabled){let bar=el("div","actions"),back=el("button","linkBtn",backLabel),next=el("button","primary",forwardLabel);back.type=next.type="button";next.disabled=Boolean(disabled);back.onclick=backFn;next.onclick=forwardFn;add(bar,back,next);app.append(bar);return next}
function chooseRounds(){let ids=groups[state.scope].pairs,specs=ids.length===2?shuffle(ids.flatMap(i=>[{i,base:"a"},{i,base:"b"}])):shuffle(ids).slice(0,4).map(i=>({i,base:Math.random()<.5?"a":"b"}));let positions=shuffle(Array.from({length:25},(_,i)=>i)).slice(0,4);state.rounds=specs.map((x,n)=>{let pair=pairs[x.i];return {pair,base:pair[x.base],other:pair[x.base==="a"?"b":"a"],position:positions[n],wrong:0}});if(state.previousPositions.length===4&&state.rounds.every((r,i)=>r.position===state.previousPositions[i])){let a=state.rounds[0].position;state.rounds[0].position=state.rounds[1].position;state.rounds[1].position=a}state.previousPositions=state.rounds.map(r=>r.position)}
function intro(){stopAudio();app.replaceChildren();add(app,el("div","eyebrow","J-SHARE · Pre-arrival Japanese"),el("div","hero","あ"),el("h1","","Find the different hiragana."),el("p","lead","In a 5 × 5 grid, one character is different. Find it and tap it."));let chips=el("div","chips");["4 rounds","About 3–5 minutes","No sign-in"].forEach(x=>chips.append(el("span","chip",x)));app.append(chips);let setup=el("div","setup"),label=el("label","","Practice range"),select=el("select");label.htmlFor="scope";select.id="scope";for(let id of ["g1","g2","g3","all"]){let opt=el("option","",groups[id].label+" / "+groups[id].en);opt.value=id;select.append(opt)}select.value=state.scope;select.onchange=()=>state.scope=select.value;add(setup,label,select);app.append(setup,el("p","instruction","Compare the characters first. In each grid, the odd character appears once. An incorrect tap can be retried without a timer."));let start=el("button","primary","See the characters →");start.onclick=()=>{chooseRounds();preview()};app.append(start)}
function preview(){stopAudio();app.replaceChildren();header("Before the grid · compare the shapes","Look closely.","These are the characters you will see. On each grid, one of the two appears only once.");let grid=el("div","pairPreview");for(let p of [...new Set(state.rounds.map(r=>r.pair))]){let line=el("div","pairLine");for(let k of ["a","b"]){if(k==="b")line.append(el("span","vs","and"));let item=el("div","pairLetter"),reading=p["r"+k];add(item,el("span","",p[k]),el("small","",reading),audioButton(p[k],reading));line.append(item)}grid.append(line)}app.append(grid,el("p","instruction","Tap ▶ to hear each hiragana using your device's Japanese speech voice. You can complete the quiz without audio."));buttons("Change range",intro,"Start 4 grids →",()=>{state.index=0;state.wrong=0;state.firstTry=0;question()})}
function question(){stopAudio();state.done=false;state.wrongTiles=new Set();let r=state.rounds[state.index];app.replaceChildren();let top=el("div","topline");add(top,el("span","","GRID "+(state.index+1)+" OF 4"),el("span","",groups[state.scope].en));app.append(top);let progress=el("div","progress"),fill=el("span");fill.style.width=(state.index*25)+"%";progress.setAttribute("role","progressbar");progress.setAttribute("aria-label","Quiz progress");progress.setAttribute("aria-valuenow",String(state.index));progress.setAttribute("aria-valuemin","0");progress.setAttribute("aria-valuemax","4");progress.append(fill);app.append(progress,el("h2","","Find the one that is different."),el("p","instruction","Tap the odd character. Look closely at its shape."));let wrap=el("div","gridWrap"),grid=el("div","kanaGrid");grid.setAttribute("role","group");grid.setAttribute("aria-label","25 hiragana characters, one is different");for(let i=0;i<25;i++){let b=el("button","kanaCell"),char=i===r.position?r.other:r.base;b.type="button";b.dataset.cell=String(i);b.setAttribute("aria-label","Row "+(Math.floor(i/5)+1)+", column "+(i%5+1)+": "+char);b.append(el("span","",char));b.onclick=()=>chooseCell(i);grid.append(b)}wrap.append(grid);app.append(wrap);let feedback=el("div");feedback.id="feedback";feedback.setAttribute("aria-live","polite");app.append(feedback);let next=buttons("Back to character list",preview,"Next grid →",()=>{state.index++;state.index<4?question():summary()},true);next.id="next"}
function chooseCell(pos){if(state.done)return;let r=state.rounds[state.index],f=document.getElementById("feedback"),tile=app.querySelector('[data-cell="'+pos+'"]');if(pos!==r.position){if(state.wrongTiles.has(pos))return;state.wrongTiles.add(pos);r.wrong++;state.wrong++;tile.classList.add("wrong");tile.disabled=true;f.replaceChildren();f.className="feedback reconsider";add(f,el("strong","","Try another square."),el("p","note","You tapped "+r.base+", the character that appears many times. "+r.pair.tip));return}state.done=true;if(r.wrong===0)state.firstTry++;tile.classList.add("right");app.querySelectorAll("[data-cell]").forEach(x=>x.disabled=true);let oddReading=r.other===r.pair.a?r.pair.ra:r.pair.rb,baseReading=r.base===r.pair.a?r.pair.ra:r.pair.rb;f.replaceChildren();f.className="feedback";let line=el("p");add(line,el("span","jp",r.other),el("span","meaning"," "+oddReading+" "),audioButton(r.other,oddReading));add(f,el("strong","","You found the different character."),line,el("p","note","The other 24 are "+r.base+" ("+baseReading+"). "+r.pair.tip));let next=document.getElementById("next");next.disabled=false;next.textContent=state.index===3?"See your review →":"Next grid →";f.scrollIntoView({behavior:"smooth",block:"nearest"})}
function summary(){stopAudio();app.replaceChildren();add(app,el("div","eyebrow","Practice complete"),el("div","hero","🌱"),el("h1","","You've found the differences."),el("p","lead","You found the odd character in all four grids. "+state.firstTry+" of 4 were found on the first tap. This is practice, not a reading-level test."));app.append(el("h2","","Look and listen again"));let list=el("div","summaryGrid");for(let r of state.rounds){let reading=r.other===r.pair.a?r.pair.ra:r.pair.rb,row=el("div","review"),text=el("div");add(text,el("span","jp",r.other),el("small","",reading+" · "+(r.wrong?r.wrong+" extra tap"+(r.wrong===1?"":"s"):"first tap")));add(row,text,audioButton(r.other,reading));list.append(row)}app.append(list);buttons("Change range",intro,"Practice again ↻",()=>{chooseRounds();preview();window.scrollTo(0,0)});window.scrollTo(0,0)}
app.addEventListener("click",event=>{let b=event.target.closest("[data-speak]");if(!b)return;event.preventDefault();event.stopPropagation();speak(b.dataset.speak)});
intro();
</script></body></html>
